# ---- GTNH Labeled Wireless Transceiver - build configuration ----
# Toolchain: GTNHGradle (gtnhsettingsconvention 2.0.20 / gtnhconvention) + RetroFuturaGradle
# Target: Minecraft 1.7.10, Forge 10.13.4.1614 (GTNH 2.8.4 line)

# Mod metadata (populates mcmod.info and artifact naming)
modName = GTNH Labeled Wireless Transceiver
modId = gtnhlabeledwireless
modGroup = com.gtnhwireless
useModGroupForPublishing = true

# Project version (gitVersion module is disabled below, so set explicitly)
version = 0.5.1

# Minecraft / Forge
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614

# MCP mappings for dependency deobfuscation and the deobfParams task
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Default username for runClient/runServer testing tasks
developmentEnvironmentUserName = Developer

# Modern Java: Jabel lets us use newer syntax while emitting Java 8 bytecode
# (MC 1.7.10 / Forge run on Java 8). Our sources are Java 8-style, so this is a safe no-op.
enableModernJavaSyntax = jabel
enableGenericInjection = true

# Version token class generation - disabled; mod reads its version from Reference.java
generateGradleTokenClass =
gradleTokenVersion =

# This port uses neither access transformers nor mixins
accessTransformersFile =
usesMixins = false

# Pull in CurseMaven / Modrinth and other well-known 1.7.10 repositories
includeWellKnownRepositories = true

# Local build only - disable Maven publishing and the modules that need
# git tags (gitVersion) or code formatting enforcement (codeStyle).
usesMavenPublishing = false
gtnh.modules.gitVersion = false
gtnh.modules.codeStyle = false

# Build performance
org.gradle.parallel = true
# Disabled to avoid first-run configuration-cache incompatibilities with the toolchain.
org.gradle.configuration-cache = false

# Toolchain JDK 25: GTNHGradle 2.0.20 requires JVM 25+ (gradle-daemon-jvm.properties toolchainVersion=25).
# Machine-specific JDK paths live in the user-level ~/.gradle/gradle.properties (NOT committed),
# so CI and other machines do not break. CI supplies JDKs via setup-java in the workflow.
forceToolchainVersion = 25
