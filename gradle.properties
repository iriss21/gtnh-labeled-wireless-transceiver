# ---- GTNH Labeled Wireless Transceiver 鈥?build configuration ----
# Toolchain: GTNHGradle (gtnhsettingsconvention 2.0.20 / gtnhconvention) + RetroFuturaGradle
# Target: Minecraft 1.7.10, Forge 10.13.4.1614 (GTNH 2.8.4 line)

# Mod metadata (populates mcmod.info and artifact naming)
modName = GTNH Labeled Wireless Transceiver
modId = gtnhlabeledwireless
modGroup = com.gtnhwireless
useModGroupForPublishing = true

# Project version (gitVersion module is disabled below, so set explicitly)
version = 0.4.1

# Minecraft / Forge
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614

# MCP mappings for dependency deobfuscation and the deobfParams task
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Default username for runClient/runServer testing tasks
developmentEnvironmentUserName = Developer

# Modern Java: Jabel lets us use newer syntax while emitting Java 8 bytecode
# (MC 1.7.10 / Forge run on Java 8). Our sources are Java 8-style, so this is a safe no-op.
enableModernJavaSyntax = jabel
enableGenericInjection = true

# Version token class generation 鈥?disabled; mod reads its version from Reference.java
generateGradleTokenClass =
gradleTokenVersion =

# This port uses neither access transformers nor mixins
accessTransformersFile =
usesMixins = false

# Pull in CurseMaven / Modrinth and other well-known 1.7.10 repositories
includeWellKnownRepositories = true

# Local build only 鈥?disable Maven publishing and the modules that need
# git tags (gitVersion) or code formatting enforcement (codeStyle).
usesMavenPublishing = false
gtnh.modules.gitVersion = false
gtnh.modules.codeStyle = false

# Build performance
org.gradle.parallel = true
# Disabled to avoid first-run configuration-cache incompatibilities with the toolchain.
org.gradle.configuration-cache = false

# Use the locally-installed JDK 25 (Temurin, at F:/AItemp/jdk25) for the Gradle daemon
# (see gradle-daemon-jvm.properties, toolchainVersion=25) and the compile toolchain, and do
# NOT auto-provision a JDK from foojay. The foojay fetch for JDK 25 returned a package without
# javac/javadoc/jar in this environment, so we supply a real JDK 25 manually. The GTNHGradle
# 2.0.20 convention plugin requires a JVM 25+ to run, making this mandatory.
#
# RetroFuturaGradle resolves its toolchains against vendor=Azul Zulu specifically, so every
# required JDK must be an Azul Zulu build (not just any JDK of that version):
#   - F:/AItemp/zulu25 : languageVersion=25 鈥?the Gradle daemon JVM (gradle-daemon-jvm.properties
#                        toolchainVersion=25) AND the mod's own :compileJava (forceToolchainVersion=25)
#                        both require an Azul-Zulu JDK 25.
#   - F:/AItemp/zulu8  : languageVersion=8  鈥?:compileMcLauncherJava (MC launcher helper).
#   - F:/AItemp/zulu17 : languageVersion=17 鈥?:decompileSrgJar (fernflower).
# Toolchain auto-provisioning is disabled, so all three must be supplied locally and listed here.
# F:/Java is Microsoft JDK 17 (kept only as a legacy probe fallback; not Azul, never selected).
org.gradle.java.installations.auto-download = false
org.gradle.java.installations.paths = F:/AItemp/zulu25,F:/AItemp/zulu8,F:/AItemp/zulu17,F:/Java
forceToolchainVersion = 25
